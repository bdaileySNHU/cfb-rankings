<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Open Graph / Social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Stat-urday">
  <meta property="og:title" content="Game Schedule — Stat-urday">
  <meta property="og:description" content="College football game schedule and results with ELO rating changes.">
  <meta property="og:url" content="https://cfb.bdailey.com/games.html">
  <meta property="og:image" content="https://cfb.bdailey.com/images/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:alt" content="Stat-urday — college football Elo rankings">
  <!-- Twitter / X card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Game Schedule — Stat-urday">
  <meta name="twitter:description" content="College football game schedule and results with ELO rating changes.">
  <meta name="twitter:image" content="https://cfb.bdailey.com/images/og-default.png">
  <!-- Canonical -->
  <meta name="description" content="Every college football game this season with final scores and the exact Elo rating change each result produced. Browse by week, conference or team.">
  <link rel="canonical" href="https://cfb.bdailey.com/games.html">
  <title>Games - College Football Rankings</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components/board.css">
  <link rel="stylesheet" href="css/components/game-card.css">
  <style>
    /* Game date column styling */
    .game-date {
      white-space: nowrap;
      color: var(--fg2);
      font-size: 0.9em;
    }

    /* Responsive: Hide date column on small mobile devices */
    @media (max-width: 480px) {
      .schedule-table > thead th:nth-child(2),
      td.game-date {
        display: none;
      }
    }

    /* Responsive: Show abbreviated date on medium mobile/tablet */
    @media (min-width: 481px) and (max-width: 768px) {
      .game-date {
        font-size: 0.85em;
      }
    }

    /* Ticker-style table overrides. .tkr-table itself comes from board.css -
       redefining it here reintroduced overflow:hidden and clipped the right-hand
       columns on mobile. */
    .schedule-table {
      width: 100%;
      border-collapse: collapse;
      background: transparent;
    }

    .schedule-table th {
      background: var(--panel);
      padding: 10px 14px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--fg3);
      border-bottom: 1px solid var(--line);
    }

    .schedule-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      color: var(--fg);
      font-size: 13px;
    }

    .schedule-table tbody tr {
      transition: background 0.12s ease;
    }

    .schedule-table tbody tr:hover {
      background: var(--panel2);
      cursor: pointer;
    }

    .schedule-table tbody tr:last-child td {
      border-bottom: none;
    }

    /* Live games render as cards above the table (game-card.js). */
    .live-chips { font-family: var(--font-mono); font-size: 11px; color: var(--fg3); }
    .live-chips { display: block; margin-top: 3px; font-style: normal; }
    .live-final { color: var(--fg); font-weight: 700; font-family: var(--font-mono); font-style: normal; }
  </style>
</head>
<body class="tkr">
  <!-- Site chrome (header + nav) injected by layout.js -->
  <script src="js/layout.js"></script>

  <div class="tkr-wrap">
    <div class="tkr-pagehead">
      <div>
        <h1 class="tkr-title">Game Schedule & Results</h1>
        <p class="tkr-subtitle">College football game outcomes and ELO rating changes</p>
      </div>
    </div>

    <div class="tkr-filter-bar" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; margin-bottom: 0.5rem;">
      <h2 style="font-family: var(--font-sans); font-size: 14.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--fg); margin: 0;">All Games</h2>
      <div class="filters">
        <!-- Options are rebuilt from the loaded schedule by populateWeekFilter() -->
        <select class="filter-select" id="week-filter">
          <option value="">All Weeks</option>
        </select>
      </div>
    </div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <span>Loading games...</span>
    </div>

    <div id="games-container" class="hidden">
      <div class="gc-stack" id="live-cards"></div>
      <div class="tkr-table" style="margin: 1.5rem 0;">
        <table class="schedule-table">
          <thead>
            <tr>
              <th>Week</th>
              <th>Date</th>
              <th>Winner</th>
              <th>Score</th>
              <th>Loser</th>
              <th>Location</th>
              <th>ELO Change</th>
            </tr>
          </thead>
          <tbody id="games-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>&copy; 2026 Stat-urday</p>
      <p><a href="elo-formula.html">How It Works</a> | <a href="https://github.com" target="_blank" rel="noopener">GitHub</a></p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/paging.js"></script>
  <script src="js/date-utils.js"></script>
  <script src="js/season.js"></script>
  <script src="js/countdown.js"></script>
  <script src="js/live.js"></script>
  <script src="js/team-visuals.js"></script>
  <script src="js/game-card.js"></script>
  <script>
    let allGames = [];
    let teams = {};
    let meta = {};         // teams-meta.json: abbreviations and colours
    let preds = {};        // this week's predictions by game id

    document.addEventListener('DOMContentLoaded', () => {
      loadGames();
      document.getElementById('week-filter').addEventListener('change', filterGames);
    });

    async function loadGames() {
      try {
        // Year and current week; the week picks the default filter below.
        const season = await api.fetch('/seasons/active')
          .catch(() => ({ year: new Date().getFullYear(), current_week: null }));
        const activeSeason = season.year;

        const [gamesData, teamsData, metaData, predData] = await Promise.all([
          fetchAllGames(activeSeason),
          // getTeams() defaults to limit=100 against ~240 FBS teams. Any game
          // whose team fell outside that first page hit the `!homeTeam` guard
          // in displayGames() and was dropped from the table without a trace.
          fetchAllPages((skip, limit) => api.getTeams(null, skip, limit)),
          fetch('data/teams-meta.json').then(r => r.json()).catch(() => ({})),
          api.getPredictions({ nextWeek: true }).catch(() => [])
        ]);
        meta = metaData;
        (predData || []).forEach(p => preds[p.game_id] = p);

        allGames = gamesData;

        // Create teams lookup
        teamsData.forEach(t => teams[t.id] = t);

        populateWeekFilter(allGames);
        document.getElementById('week-filter').value = defaultWeek(allGames, season.current_week);
        filterGames();
        // One week is ~60 rows, so each live tick just redraws it; that also
        // moves games that just kicked off to the top.
        live.poll(filterGames);
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('games-container').classList.remove('hidden');
        // Front-page cards link to games.html#game-<id>; the card did not
        // exist when the browser tried the anchor.
        const target = location.hash && document.getElementById(location.hash.slice(1));
        if (target) target.scrollIntoView();
      } catch (err) {
        console.error('Error loading games:', err);
      }
    }

    // A full season is ~900 games and the API caps limit at 500, so the old
    // single limit=200 request truncated to whichever weeks sort first — the
    // reason weeks past the cutoff rendered empty.
    function fetchAllGames(season) {
      return fetchAllPages((skip, limit) => api.getGames({ season, skip, limit }));
    }

    // Weeks were hardcoded 1-5. Build them from the schedule instead so bowl and
    // championship weeks show up without another edit.
    function populateWeekFilter(games) {
      const select = document.getElementById('week-filter');
      const weeks = [...new Set(games.map(g => g.week))].sort((a, b) => a - b);
      select.innerHTML = '<option value="">All Weeks</option>' +
        weeks.map(w => `<option value="${w}">Week ${w}</option>`).join('');
    }

    // The week being played or up next: the earliest week, from the season's
    // current week on, that still has unplayed games. current_week keeps a
    // stray never-processed game from an old week from pinning the default.
    function defaultWeek(games, currentWeek) {
      const pending = games
        .filter(g => !isPlayed(g) && (currentWeek == null || g.week >= currentWeek))
        .map(g => g.week);
      if (pending.length) return String(Math.min(...pending));
      return currentWeek != null ? String(currentWeek) : '';
    }

    function filterGames() {
      const week = document.getElementById('week-filter').value;
      const filtered = week ? allGames.filter(g => g.week === parseInt(week)) : allGames;
      displayGames(filtered);
    }

    function displayGames(games) {
      const tbody = document.getElementById('games-tbody');
      tbody.innerHTML = '';
      const cards = [];

      // Chronological: week 1 first. Descending suited a results table mid-season,
      // but this is mostly a forward schedule now. game_date breaks ties within a
      // week; the few rows CFBD has not timed yet fall back to id.
      games.sort((a, b) =>
        isLive(b) - isLive(a) ||
        a.week - b.week ||
        (a.game_date || '').localeCompare(b.game_date || '') ||
        a.id - b.id
      ).forEach(game => {
        if (isLive(game)) { cards.push(liveCard(game)); return; }
        const row = renderRow(game);
        if (row) tbody.appendChild(row);
      });
      document.getElementById('live-cards').innerHTML = cards.join('');
    }

    function liveCard(game) {
      const home = teams[game.home_team_id], away = teams[game.away_team_id];
      return GameCard.games(live.find(home.name, away.name), {
        meta: name => meta[name], pred: preds[game.id], age: live.age(), id: 'game-' + game.id,
      });
    }

    // In progress per CFBD and not yet final in our data.
    function isLive(game) {
      const home = teams[game.home_team_id], away = teams[game.away_team_id];
      const lv = home && away && !isPlayed(game) && live.find(home.name, away.name);
      return lv && lv.status === 'in_progress' ? 1 : 0;
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
    }

    // CFBD spreads are home-perspective: negative = home favored.
    function vegasLine(g) {
      if (g.spread == null) return '';
      if (g.spread === 0) return 'Vegas PK';
      return `Vegas ${g.spread < 0 ? g.home : g.away} -${Math.abs(g.spread)}`;
    }

    function weatherText(w) {
      if (!w || w.temperature == null) return '';
      let t = `${Math.round(w.temperature)}°`;
      if (w.description) t += ` ${w.description.toLowerCase()}`;
      if (w.wind_speed) t += `, wind ${Math.round(w.wind_speed)} mph`;
      return t;
    }

    function renderRow(game) {
        const row = document.createElement('tr');
        row.dataset.gameId = game.id;

        // Check if game has been played (see isPlayed in date-utils.js —
        // scheduled games carry placeholder 0-0 scores, not nulls).
        const hasScore = isPlayed(game);

        if (hasScore) {
          // Completed game - display winner/loser
          const winner = game.home_score > game.away_score ? teams[game.home_team_id] : teams[game.away_team_id];
          const loser = game.home_score > game.away_score ? teams[game.away_team_id] : teams[game.home_team_id];

          // Skip if teams not found
          if (!winner || !loser) return null;

          const winnerScore = Math.max(game.home_score, game.away_score);
          const loserScore = Math.min(game.home_score, game.away_score);
          const isHomeWin = game.home_score > game.away_score;
          const location = game.is_neutral_site ? 'Neutral' : (isHomeWin ? 'Home' : 'Away');
          const eloChange = Math.abs(isHomeWin ? game.home_rating_change : game.away_rating_change);

          // Format game date
          const formattedDate = formatGameDate(game.game_date);
          const fullDateTime = getFullDateTime(game.game_date);

          row.innerHTML = `
            <td style="font-weight: 600; font-family: var(--font-mono);">Week ${game.week}</td>
            <td class="game-date" title="${fullDateTime}" style="color: var(--fg2); white-space: nowrap; font-size: 0.9em;">${formattedDate}</td>
            <td><a href="team.html?id=${winner.id}" style="color: var(--accent); text-decoration: none; font-weight: 600;">${winner.name}</a></td>
            <td style="font-weight: 700; color: var(--pos); font-family: var(--font-mono);">${winnerScore}-${loserScore}</td>
            <td><a href="team.html?id=${loser.id}" style="color: var(--fg2); text-decoration: none;">${loser.name}</a></td>
            <td style="color: var(--fg2);">${location}</td>
            <td style="color: var(--accent); font-weight: 600; font-family: var(--font-mono);">+${eloChange.toFixed(2)}</td>
          `;
        } else {
          // Future/scheduled game - display matchup
          const homeTeam = teams[game.home_team_id];
          const awayTeam = teams[game.away_team_id];

          // Skip if teams not found
          if (!homeTeam || !awayTeam) return null;

          const lv = live.find(homeTeam.name, awayTeam.name);
          const location = game.is_neutral_site ? 'Neutral Site' : homeTeam.name;
          // CFBD final that our nightly import has not picked up yet.
          const middle = lv && lv.status === 'completed'
            ? `<span class="live-final">FINAL ${lv.away_points}-${lv.home_points}</span>`
            : 'vs';
          const chips = lv && lv.status === 'scheduled'
            ? [lv.tv, vegasLine(lv), lv.over_under != null ? `O/U ${lv.over_under}` : '', weatherText(lv.weather)]
                .filter(Boolean).map(esc).join(' · ')
            : '';

          // Format game date
          const formattedDate = formatGameDate(game.game_date);
          const fullDateTime = getFullDateTime(game.game_date);

          row.classList.add('game-scheduled');
          row.innerHTML = `
            <td style="font-weight: 600; font-family: var(--font-mono);">Week ${game.week}</td>
            <td class="game-date" title="${fullDateTime}" style="color: var(--fg2); white-space: nowrap; font-size: 0.9em; font-style: italic;">${formattedDate}</td>
            <td><a href="team.html?id=${awayTeam.id}" style="color: var(--fg2); text-decoration: none;">${awayTeam.name}</a></td>
            <td style="font-style: italic; color: var(--fg3);">${middle}</td>
            <td><a href="team.html?id=${homeTeam.id}" style="color: var(--fg2); text-decoration: none;">${homeTeam.name}</a></td>
            <td style="color: var(--fg3); font-style: italic;">${location}${chips ? `<span class="live-chips">${chips}</span>` : ''}</td>
            <td style="color: var(--fg3); font-style: italic; font-family: var(--font-mono);">TBD</td>
          `;
        }

        return row;
    }
  </script>
</body>
</html>
