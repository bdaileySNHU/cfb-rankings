# Nginx configuration for College Football Rankings
# Place this in /etc/nginx/sites-available/cfb-rankings
# Then symlink to /etc/nginx/sites-enabled/
#
# NOTE: deploy/deploy.sh does NOT copy this file - it only runs `nginx -t` and
# reloads. Changing it here changes nothing on the server. Diff it against the
# live /etc/nginx/sites-available/cfb-rankings before copying, because that file
# has been hand-edited in the past and may carry changes never committed here.

server {
    listen 80;
    server_name cfb.bdailey.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cfb.bdailey.com;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/cfb.bdailey.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cfb.bdailey.com/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Logging
    access_log /var/log/nginx/cfb-rankings-access.log;
    error_log /var/log/nginx/cfb-rankings-error.log;

    # ── Security headers ─────────────────────────────────────────────────────
    # Kept in one place and re-included in the nested asset block below, because
    # nginx does NOT inherit add_header into a location that declares its own -
    # the cache rule used to silently drop all of these from every .js and .css
    # response.
    #
    # X-XSS-Protection is deliberately absent: it is deprecated, ignored by
    # current browsers, and its legacy filter introduced vulnerabilities of its
    # own. CSP below is the replacement.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content-Security-Policy, REPORT-ONLY for now. Promote to the enforcing
    # header only after loading every page with the console open and seeing no
    # violations - a blocking CSP that is wrong takes the site down.
    #
    #   'unsafe-inline' (script + style): several pages carry inline <script>
    #       blocks and inline style="" attributes. Removing those is the
    #       prerequisite for dropping it, not a change to make in this file.
    #   analytics.bdailey.com: Umami, injected by frontend/js/layout.js.
    #   fonts.googleapis.com / gstatic: @import in frontend/css/base.css.
    #   cdn.collegefootballdata.com: team logos, frontend/js/team-visuals.js.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://analytics.bdailey.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn.collegefootballdata.com; connect-src 'self' https://analytics.bdailey.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Static files (frontend)
    location / {
        root /var/www/cfb-rankings/frontend;

        # =404, not /index.html. This is a multi-page static site, not an SPA:
        # with the old fallback every unknown path returned HTTP 200 carrying
        # the homepage, so /robots.txt and /sitemap.xml served HTML and every
        # typo'd URL looked to a crawler like a real page.
        try_files $uri $uri/ =404;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";

            # Repeated because this block's own add_header cancels inheritance.
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }
    }

    # robots.txt and sitemap.xml are served from the frontend directory by the
    # location / block above; they need no rule of their own now that the
    # catch-all is gone.

    # API requests - proxy to Gunicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # API docs
    location /docs {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
