# GitHub Actions Workflow for College Football Ranking System Tests
# Runs on push and pull requests to ensure code quality

name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # The frontend self-checks are plain node scripts with no package.json and
      # no dependencies — they read frontend/js and frontend/css as text and
      # assert on it. They run before the Python suite because they finish in
      # under a second and catch a class of grid/markup drift pytest cannot see.
      # Globbed, so a new tests/frontend/*.js is picked up without touching this
      # file. node ships on the runner image already.
      - name: Run frontend self-checks
        run: |
          for f in tests/frontend/*.js; do
            echo "── $f"
            node "$f"
          done

      # Set up Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      # Cache pip dependencies
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Run unit tests
      - name: Run unit tests
        run: |
          pytest -m unit -v --tb=short

      # Run integration tests
      - name: Run integration tests
        run: |
          pytest -m integration -v --tb=short

      # Run all tests with coverage (except E2E)
      - name: Run tests with coverage
        run: |
          pytest -m "not e2e" --cov=. --cov-report=xml --cov-report=term-missing

      # Upload coverage to Codecov (optional)
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      # Archive test results
      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            htmlcov/
            .coverage
          retention-days: 7

  # Browser-driven tests. Slower than the suite above, so they run in their
  # own job after it passes.
  e2e-test:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    needs: test  # Only run if unit/integration tests pass
    timeout-minutes: 30  # Prevent hung tests from running forever

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # --with-deps pulls the system libraries the bundled Chromium needs on
      # the runner image; without it the browser fails to launch.
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      # The live_server fixture starts the app itself on port 8765 and the
      # test_db fixture points it at the per-test SQLite database, so there is
      # no server to launch or database to seed here.
      - name: Run E2E tests
        run: pytest -m e2e -v --tb=short
